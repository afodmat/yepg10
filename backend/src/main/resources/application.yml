spring:
  application.name: yep-platform
  datasource:
    url: ${DB_URL}
    username: ${DB_USER:${DB_USERNAME}}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
  jackson.default-property-inclusion: non_null
  servlet.multipart: { max-file-size: 5MB, max-request-size: 6MB }
server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}   # native when behind a trusted reverse proxy
  error: { include-message: never, include-stacktrace: never, include-binding-errors: never }
  servlet.session.cookie.secure: ${COOKIE_SECURE:true}
yep:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 14d
  cookies:
    secure: ${COOKIE_SECURE:true}
    same-site: Lax
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  api-url: ${API_URL:http://localhost:8080}
  rate-limit: { auth-requests-per-minute: 20 }
  storage.path: ${STORAGE_PATH:./uploads}
  dev-seed-password: ${YEP_DEV_SEED_PASSWORD:}
